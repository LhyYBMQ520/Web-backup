<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   雨夜便利店街角 · 微缩三维模型（三渲二 / セルルック）
   布局约定：底座 20x20，路面 y=0，人行道 y=0.17，店内地面 y=0.20
   +z = 画面前方（临街一侧）， +x = 右侧街道
   ===================================================================== */

const BASE = 20, HB = BASE / 2;
const ROAD_Y = 0.0, WALK_Y = 0.17, FLOOR_Y = 0.20, CEIL_Y = 3.00, WALL_H = 3.06;

/* ---------------------------------------------------------------- 基础 */
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.Fog(0x0a1220, 34, 108);

const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.5, 500);
camera.position.set(23.5, 17.0, 28.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 1.15, -0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.7;
controls.screenSpacePanning = false;
controls.minDistance = 12;
controls.maxDistance = 74;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.487;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.26;
let idleTimer = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; idleTimer = 0; });
controls.addEventListener('end', () => { idleTimer = 0.0001; });

/* ------------------------------------------------------------ 随机与工具 */
let _seed = 20260909;
function rnd() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
function pick(arr) { return arr[(rnd() * arr.length) | 0]; }

/* 4 级色阶：三渲二的核心 —— 明暗只分档，不做连续过渡 */
const gradientMap = (() => {
  const d = new Uint8Array([64, 138, 205, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();

function toon(color, o = {}) {
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap }, o));
}
/** 自发光面片（灯箱 / 招牌 / 贩卖机面板），颜色可超过 1 以驱动泛光 */
function glow(r, g, b, o = {}) {
  const m = new THREE.MeshBasicMaterial(o);
  m.color.setRGB(r, g, b, THREE.LinearSRGBColorSpace);
  return m;
}
function slab(parent, mat, x0, x1, y0, y1, z0, z1, opt = {}) {
  const g = new THREE.BoxGeometry(Math.abs(x1 - x0) || 0.001, Math.abs(y1 - y0) || 0.001, Math.abs(z1 - z0) || 0.001);
  const m = new THREE.Mesh(g, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = opt.cast !== false; m.receiveShadow = opt.recv !== false;
  parent.add(m); return m;
}
function setLayer(o, l) { o.traverse(c => c.layers.set(l)); return o; }
const FX = 1; // 层 1：不参与描边的透明特效（雨、玻璃、光晕、电线）

/* ------------------------------------------------------- 画布贴图生成器 */
const FONT_STACK = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","MS PGothic",system-ui,sans-serif';
const HAS_CJK = (() => {
  try {
    const c = document.createElement('canvas').getContext('2d');
    c.font = '40px ' + FONT_STACK;
    return Math.abs(c.measureText('一').width - c.measureText('￾').width) > 0.5;
  } catch (e) { return false; }
})();
function tex(c, rep) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/** 便利店主招牌 */
function makeSignTexture() {
  const c = cv(1024, 256), g = c.getContext('2d');
  g.fillStyle = '#f6f8f4'; g.fillRect(0, 0, 1024, 256);
  g.fillStyle = '#1a9a5c'; g.fillRect(0, 0, 1024, 16);
  g.fillStyle = '#e9662b'; g.fillRect(0, 194, 1024, 20);
  g.fillStyle = '#1a9a5c'; g.fillRect(0, 214, 1024, 21);
  g.fillStyle = '#d8233a'; g.fillRect(0, 235, 1024, 21);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#15603c';
  g.font = 'bold 104px ' + FONT_STACK;
  g.fillText(HAS_CJK ? 'ミナトマート' : 'MINATO MART', 512, 92);
  g.font = 'bold 38px ' + FONT_STACK;
  g.fillStyle = '#e9662b';
  g.fillText(HAS_CJK ? '２４時間営業' : 'OPEN 24 HOURS', 512, 158);
  return tex(c);
}
/** 招牌侧面小版（竖排） */
function makePoleSignTexture() {
  const c = cv(256, 512), g = c.getContext('2d');
  g.fillStyle = '#f6f8f4'; g.fillRect(0, 0, 256, 512);
  g.fillStyle = '#1a9a5c'; g.fillRect(0, 0, 256, 22);
  g.fillStyle = '#e9662b'; g.fillRect(0, 470, 256, 14);
  g.fillStyle = '#1a9a5c'; g.fillRect(0, 484, 256, 14);
  g.fillStyle = '#d8233a'; g.fillRect(0, 498, 256, 14);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#15603c'; g.font = 'bold 58px ' + FONT_STACK;
  const s = HAS_CJK ? ['ミ', 'ナ', 'ト', 'マ', 'ー', 'ト'] : ['M', 'I', 'N', 'A', 'T', 'O'];
  s.forEach((ch, i) => g.fillText(ch, 128, 78 + i * 66));
  g.fillStyle = '#e9662b'; g.font = 'bold 44px ' + FONT_STACK;
  g.fillText('24h', 128, 440);
  return tex(c);
}
/** 随机海报（抽象色块 + 假文字条，避免字体依赖） */
function makePosterTexture(w = 256, h = 360) {
  const c = cv(w, h), g = c.getContext('2d');
  const bgs = ['#f4efe4', '#ffffff', '#fff3d6', '#eaf4ff', '#ffe9ee'];
  g.fillStyle = pick(bgs); g.fillRect(0, 0, w, h);
  const acc = pick(['#e8552f', '#1f9c5e', '#2a6fd0', '#e0a41a', '#d0356b', '#7a4bd0']);
  g.fillStyle = acc; g.fillRect(0, 0, w, h * rr(0.10, 0.20));
  // 「商品照」区块
  const py = h * rr(0.22, 0.30), ph = h * rr(0.28, 0.40);
  const grd = g.createLinearGradient(0, py, w, py + ph);
  grd.addColorStop(0, pick(['#ffd9a0', '#cfe9ff', '#ffc9c9', '#d8f0c8']));
  grd.addColorStop(1, pick(['#e8a05a', '#7fb6e8', '#e87a7a', '#8fc46a']));
  g.fillStyle = grd; g.fillRect(w * 0.08, py, w * 0.84, ph);
  g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 2; g.strokeRect(w * 0.08, py, w * 0.84, ph);
  for (let i = 0; i < 5; i++) {
    g.fillStyle = 'rgba(0,0,0,0.10)';
    g.beginPath(); g.arc(w * rr(0.15, 0.85), py + ph * rr(0.2, 0.8), rr(8, 26), 0, 6.3); g.fill();
  }
  // 大字条 + 小字行
  g.fillStyle = acc;
  g.fillRect(w * 0.10, py + ph + h * 0.05, w * rr(0.45, 0.78), h * 0.075);
  g.fillStyle = 'rgba(30,30,40,.72)';
  for (let i = 0; i < 4; i++) g.fillRect(w * 0.10, py + ph + h * (0.15 + i * 0.045), w * rr(0.3, 0.75), h * 0.018);
  g.fillStyle = acc; g.beginPath();
  g.arc(w * 0.80, h * 0.90, w * 0.13, 0, 6.3); g.fill();
  g.fillStyle = '#fff'; g.fillRect(w * 0.71, h * 0.885, w * 0.18, h * 0.022);
  return tex(c);
}
/** 自动贩卖机正面（发光面板 + 商品阵列） */
function makeVendingTexture(warm) {
  const c = cv(256, 512), g = c.getContext('2d');
  g.fillStyle = warm ? '#c8202c' : '#0f4f8c'; g.fillRect(0, 0, 256, 512);
  g.fillStyle = warm ? '#e0303c' : '#1466ad'; g.fillRect(8, 8, 240, 88);
  g.fillStyle = '#fff'; g.font = 'bold 40px ' + FONT_STACK;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(HAS_CJK ? (warm ? 'あたたかい' : 'つめたい') : (warm ? 'HOT' : 'COLD'), 128, 52);
  // 展示窗
  g.fillStyle = '#f7fbff'; g.fillRect(14, 106, 228, 250);
  const cols = ['#e0453f', '#3fa9e0', '#e8b23a', '#4fbf6a', '#b06fd0', '#e87aa0', '#ffffff', '#3f5fd0'];
  for (let r = 0; r < 4; r++) for (let i = 0; i < 5; i++) {
    const x = 22 + i * 44, y = 114 + r * 62;
    g.fillStyle = pick(cols);
    g.beginPath();
    if (g.roundRect) { g.roundRect(x, y, 32, 52, 7); g.fill(); }
    else g.fillRect(x, y, 32, 52);
    g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(x + 4, y + 6, 6, 40);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x, y + 34, 32, 8);
  }
  // 按钮排 & 取货口
  for (let r = 0; r < 2; r++) for (let i = 0; i < 5; i++) {
    g.fillStyle = r === 0 ? '#ffd94a' : '#ffffff';
    g.fillRect(22 + i * 44, 366 + r * 26, 32, 18);
  }
  g.fillStyle = '#1a1f28'; g.fillRect(20, 424, 216, 46);
  g.fillStyle = warm ? '#8e1219' : '#0a3a68'; g.fillRect(0, 476, 256, 36);
  g.fillStyle = '#9fd8ff'; g.fillRect(196, 366, 44, 46);
  return tex(c);
}
/** 卷帘门（邻店夜间关闭） */
function makeShutterTexture() {
  const c = cv(256, 256), g = c.getContext('2d');
  g.fillStyle = '#4a5360'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 8) {
    g.fillStyle = (y / 8) % 2 ? '#3d4552' : '#59626f';
    g.fillRect(0, y, 256, 8);
    g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(0, y, 256, 2);
  }
  g.fillStyle = 'rgba(120,160,90,.20)';
  g.beginPath(); g.moveTo(30, 180); g.bezierCurveTo(90, 120, 140, 220, 220, 150);
  g.lineWidth = 14; g.strokeStyle = 'rgba(150,190,110,.18)'; g.stroke();
  return tex(c);
}
/** 店内地面（浅色瓷砖） */
function makeFloorTexture() {
  const c = cv(256, 256), g = c.getContext('2d');
  g.fillStyle = '#efe7d8'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(150,138,120,.35)'; g.lineWidth = 2;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, 256); g.stroke();
    g.beginPath(); g.moveTo(0, i * 64); g.lineTo(256, i * 64); g.stroke();
  }
  g.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = 0; i < 40; i++) g.fillRect(rr(0, 256), rr(0, 256), 3, 3);
  return tex(c, [7, 7]);
}
/** 香烟柜 / 后场货架的密集小格 */
function makeCigTexture() {
  const c = cv(256, 256), g = c.getContext('2d');
  g.fillStyle = '#d8d2c4'; g.fillRect(0, 0, 256, 256);
  const cols = ['#c9b48a', '#8fa8c0', '#c98a8a', '#f0eadc', '#9fc0a0', '#d8c060', '#b09fd0'];
  for (let r = 0; r < 10; r++) for (let i = 0; i < 12; i++) {
    g.fillStyle = pick(cols);
    g.fillRect(i * 21 + 2, r * 25 + 2, 18, 21);
    g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(i * 21 + 2, r * 25 + 19, 18, 4);
  }
  return tex(c);
}
/** 杂志封面拼贴 */
function makeMagTexture() {
  const c = cv(512, 256), g = c.getContext('2d');
  g.fillStyle = '#cfc6b4'; g.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 9; i++) {
    const x = i * 56 + 4;
    g.fillStyle = pick(['#e8dcc0', '#ffffff', '#ffe0d0', '#d8e8ff', '#ffd8e8', '#e0ffd8']);
    g.fillRect(x, 8, 50, 240);
    g.fillStyle = pick(['#d8452f', '#2a6fd0', '#1f9c5e', '#e0a41a', '#d0356b']);
    g.fillRect(x, 8, 50, 34);
    g.fillStyle = 'rgba(0,0,0,.20)';
    g.fillRect(x + 6, 60, 38, 120);
    for (let k = 0; k < 4; k++) g.fillRect(x + 6, 192 + k * 12, rr(16, 38), 5);
  }
  return tex(c);
}

const T_SIGN = makeSignTexture();
const T_POLESIGN = makePoleSignTexture();
const T_SHUTTER = makeShutterTexture();
const T_FLOOR = makeFloorTexture();
const T_CIG = makeCigTexture();
const T_MAG = makeMagTexture();
const T_VEND_C = makeVendingTexture(false);
const T_VEND_H = makeVendingTexture(true);
const T_POSTER = Array.from({ length: 8 }, () => makePosterTexture());

/* -------------------------------------------------------------- 材质库 */
const M = {
  asphalt: toon(0x2b3340),
  concrete: toon(0x5d6472),
  curb: toon(0x767d88),
  wallWhite: toon(0xe8ece8),

// 发光材质
const G = {
  signFront: glow(1.0, 1.0, 1.0, { map: T_SIGN }),
  signSide: glow(1.0, 1.0, 1.0, { map: T_POLESIGN }),

G.signFront.color.setRGB(1.45, 1.45, 1.40, THREE.LinearSRGBColorSpace);
G.signSide.color.setRGB(1.35, 1.35, 1.30, THREE.LinearSRGBColorSpace);

/* ================================================================
   共享 shader uniform（时间 / 相机 / 反光光源表）
   ================================================================ */
const SH = {
  uTime: { value: 0 },
  uCam: { value: new THREE.Vector3() },
  uLp: { value: Array.from({ length: 8 }, () => new THREE.Vector3()) },
  uLc: { value: Array.from({ length: 8 }, () => new THREE.Color()) },
  uLr: { value: new Array(8).fill(1) },

  uFogN: { value: 34 },
  uFogF: { value: 108 },

// 会在湿地面上留下倒影的光源
const reflectors = [
  { k: 'sign', p: new THREE.Vector3(-0.2, 3.60, 1.78), c: new THREE.Color(0xd8fff0), i: 1.10, r: 1.85 },
  { k: 'win', p: new THREE.Vector3(-1.0, 1.55, 1.50), c: new THREE.Color(0xffd7a2), i: 1.75, r: 2.70 },
  { k: 'win2', p: new THREE.Vector3(3.05, 1.55, 0.35), c: new THREE.Color(0xffd7a2), i: 1.20, r: 2.10 },
  { k: 'lamp', p: new THREE.Vector3(4.05, 4.15, -2.60), c: new THREE.Color(0xfff0cc), i: 1.85, r: 1.20 },

/* ------------------------------------------------- 湿滑路面 shader（核心） */
const GROUND_VERT = /* glsl */`
varying vec3 vW;
void main(){
  vec4 w = modelMatrix * vec4(position,1.0);
  vW = w.xyz;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;

const GROUND_FRAG = /* glsl */`
precision highp float;
varying vec3 vW;
uniform float uTime, uWet, uPud, uMark, uRefl, uFogN, uFogF;
uniform vec3 uBase, uCam, uFog;
uniform vec3 uLp[8];
uniform vec3 uLc[8];
uniform float uLr[8];

vec3 SR(vec3 c){ return pow(c, vec3(2.2)); }
float h21(vec2 p){ p = fract(p*vec2(127.31,311.7)); p += dot(p,p+41.31); return fract(p.x*p.y*95.43); }
float vn(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*vn(p); p*=2.07; a*=0.5; } return s; }
float sbox(vec2 p, vec2 a, vec2 b, float e){
  vec2 t = smoothstep(a-e,a+e,p) * (1.0-smoothstep(b-e,b+e,p));
  return t.x*t.y;
}
float bnd(float x, float c, float w){ return 1.0-smoothstep(w*0.5-0.022, w*0.5+0.022, abs(x-c)); }

/* 路面涂装：斑马线 / 中心虚线 / 停止线 / 路缘线 / 停车位 / 点字ブロック */
vec4 markings(vec2 p){
  float e = 0.022, w = 0.0, yl = 0.0;

  float inCW = sbox(p, vec2(-3.45,5.18), vec2(0.65,9.02), e);
  float bars = step(0.5, fract((p.x+3.45)/1.025));
  w += inCW * bars;

  float front = sbox(p, vec2(-9.9,5.06), vec2(9.1,9.14), e);
  w += front * bnd(p.y,7.10,0.15) * step(0.55, fract(p.x/1.95)) * (1.0-inCW);

  float east = sbox(p, vec2(5.06,-9.9), vec2(9.14,4.60), e);
  w += east * bnd(p.x,7.10,0.15) * step(0.55, fract(p.y/1.95));

  w += sbox(p, vec2(-9.9,4.97), vec2(5.04,5.09), 0.016);
  w += sbox(p, vec2(4.97,-9.9), vec2(5.09,5.09), 0.016);
  w += sbox(p, vec2(5.20,4.66), vec2(7.00,4.88), 0.016);

  float bay = sbox(p, vec2(-9.75,0.50), vec2(-5.70,4.70), e);
  float pl = bnd(p.x,-9.68,0.14)+bnd(p.x,-7.72,0.14)+bnd(p.x,-5.76,0.14)+bnd(p.y,0.58,0.14);
  w += bay*min(pl,1.0);

  float tp = bnd(p.y,4.26,0.36) * sbox(p, vec2(-5.55,0.0), vec2(4.62,9.0), e)
           + bnd(p.x,4.26,0.36) * sbox(p, vec2(0.0,-9.55), vec2(9.0,4.62), e);
  vec2 gg = fract(p*3.6)-0.5;
  yl += min(tp,1.0) * (1.0-smoothstep(0.19,0.30,length(gg)));

  w = clamp(w,0.0,1.0); yl = clamp(yl,0.0,1.0);
  return vec4(SR(vec3(0.90,0.93,0.95))*w + SR(vec3(0.95,0.76,0.18))*yl, clamp(w+yl,0.0,1.0));
}

/* 积水分布：噪声水洼 + 路缘排水沟长期积水 */
float puddle(vec2 p){
  float m = smoothstep(0.50,0.73, fbm(p*0.62));
  float gut = sbox(p, vec2(-9.9,5.02), vec2(4.92,5.46), 0.09)
            + sbox(p, vec2(5.02,-9.6), vec2(5.46,5.46), 0.09);
  float alley = sbox(p, vec2(-5.4,-2.6), vec2(-3.6,0.9), 0.35)*0.85;
  return clamp(m + gut*0.92 + alley, 0.0, 1.0);
}

/* 雨滴打出的同心涟漪（多层网格 + 随机相位），同时输出梯度用于扰动倒影 */
float ripples(vec2 p, float t, out vec2 grad){
  float sum = 0.0; grad = vec2(0.0);
  for(int i=0;i<3;i++){
    float sc = 1.7 + float(i)*1.35;
    vec2 q = p*sc, cell = floor(q), f = fract(q)-0.5;
    float hh = h21(cell + float(i)*23.17);
    vec2 off = (vec2(h21(cell+3.11), h21(cell+7.77))-0.5)*0.66;
    float d = length(f-off);
    float per = 1.35 + hh*1.25;
    float ph = fract(t/per + hh);
    float r = ph*0.52;
    float ring = exp(-pow((d-r)/0.058,2.0)) * (1.0-ph) * smoothstep(0.0,0.09,ph);
    sum += ring;
    grad += normalize(f-off+vec2(1e-4)) * ring;
  }
  return sum;
}
/* 雨点砸落瞬间的细碎亮斑 */
float spark(vec2 p, float t){
  vec2 q = p*10.0, c = floor(q), f = fract(q)-0.5;
  float hh = h21(c);
  float ph = fract(t*2.6 + hh*11.0);
  float d = length(f - (vec2(h21(c+1.73),h21(c+4.31))-0.5)*0.8);
  return (1.0-smoothstep(0.02,0.10,d)) * (1.0-smoothstep(0.0,0.20,ph));
}
/* 霓虹在湿地上的竖向拉伸倒影（朝相机方向拉长） */
vec3 reflections(vec2 p){
  vec3 acc = vec3(0.0);
  vec2 cam = uCam.xz;
  for(int i=0;i<8;i++){
    vec3 L = uLp[i];
    vec2 d0 = normalize(L.xz - cam + vec2(1e-4));
    vec2 dl = p - L.xz;
    float al = dot(dl,d0);
    float pe = dot(dl, vec2(-d0.y,d0.x));
    float hg = max(L.y, 0.5);
    float a = al / (uLr[i] * (al < 0.0 ? hg*0.85 : 0.34));
    float b = pe / (uLr[i]*0.44);
    acc += uLc[i] * exp(-(a*a + b*b));
  }
  return acc;
}

void main(){
  vec2 p = vW.xz;
  vec3 col = uBase * (0.84 + 0.30*fbm(p*1.7));

  vec4 mk = markings(p) * uMark;
  col = mix(col, mk.rgb, mk.a*0.93);

  float pm = puddle(p) * uPud;
  vec2 grad; float rip = ripples(p, uTime, grad) * pm;

  col = mix(col, col*0.28 + SR(vec3(0.014,0.030,0.055)), uWet*(0.34+0.56*pm));
  col += SR(vec3(0.048,0.088,0.155)) * uWet * (0.26 + 0.95*pm);

  vec3 rf = reflections(p + grad*0.42);
  col += rf * uRefl * (0.26 + 1.30*pm) * (1.0 + 1.5*mk.a);

  col += vec3(0.50,0.68,0.95) * rip * 0.42;
  col += vec3(0.46,0.62,0.90) * spark(p, uTime) * uWet * 0.30;

  float f = smoothstep(uFogN, uFogF, length(vW - uCam));
  col = mix(col, uFog, f*0.85);
  gl_FragColor = vec4(col, 1.0);
}`;

function items(parent, x0, x1, z0, z1, yList, opt = {}) {
  const dx = opt.dx || 0.19, sz = opt.sz || 0.17, sy = opt.sy || 0.24;
  const rows = [];
  yList.forEach(y => {
    const n = Math.max(1, Math.floor((x1 - x0) / dx));
    for (let i = 0; i < n; i++) if (rnd() > (opt.gap || 0.06)) rows.push([x0 + dx * 0.5 + i * dx, y, (z0 + z1) / 2, sz, sy]);
  });
  if (!rows.length) return null;
  const im = new THREE.InstancedMesh(itemGeo, opt.mat || M.white, rows.length);
  const mm = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), pv = new THREE.Vector3();
  rows.forEach((r, i) => {
    const h = r[4] * rr(0.75, 1.05), w = r[3] * rr(0.72, 1.0), d = Math.abs(z1 - z0) * rr(0.55, 0.9);
    pv.set(r[0] + rr(-0.012, 0.012), r[1] + h / 2, r[2] + rr(-0.02, 0.02));
    s.set(w, h, d);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rr(-0.09, 0.09));
    im.setMatrixAt(i, mm.compose(pv, q, s));
    im.setColorAt(i, new THREE.Color(pick(ITEM_COLS)));
  });
  im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = true; im.receiveShadow = true;
  parent.add(im); return im;
}

const GLASS_RAIN_FRAG = /* glsl */`
precision highp float;
varying vec2 vUv;
uniform float uTime; uniform vec2 uRep;
float h21(vec2 p){ p = fract(p*vec2(127.31,311.7)); p += dot(p,p+41.31); return fract(p.x*p.y*95.43); }
void main(){
  vec2 uv = vUv*uRep;
  vec2 cell = floor(uv), f = fract(uv);
  float s = h21(cell);
  float sp = 0.10 + 0.42*s;
  float ph = fract(uTime*sp + s*7.0);
  float dy = 1.0 - ph;
  float dx = 0.5 + (s-0.5)*0.55 + 0.05*sin(uTime*0.8 + s*24.0);
  float d = length((f - vec2(dx,dy)) * vec2(1.8,1.0));
  float drop = 1.0 - smoothstep(0.045,0.115,d);
  float trail = (1.0-smoothstep(0.010,0.045,abs(f.x-dx)))
              * smoothstep(dy,dy+0.40,f.y) * (1.0-smoothstep(0.92,1.0,f.y)) * 0.32;
  vec2 b = vec2(h21(cell+5.31), h21(cell+9.13));
  float beads = (1.0-smoothstep(0.028,0.070,length(f-b))) * 0.42 * step(0.42, h21(cell+2.27));
  float a = clamp(drop + trail + beads, 0.0, 1.0);
  gl_FragColor = vec4(vec3(0.68,0.84,1.0)*a, a);
}`;

const RAIN_N = 4200, RAIN_TOP = 13.0, RAIN_BOT = -0.4;
(() => {
  const base = new THREE.PlaneGeometry(1, 1);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index;
  geo.attributes.position = base.attributes.position;
  geo.attributes.uv = base.attributes.uv;
  const pos = new Float32Array(RAIN_N * 3), par = new Float32Array(RAIN_N * 3);
  for (let i = 0; i < RAIN_N; i++) {
    pos[i * 3] = rr(-HB - 1.4, HB + 1.4);
    pos[i * 3 + 1] = rr(0, RAIN_TOP - RAIN_BOT);
    pos[i * 3 + 2] = rr(-HB - 1.4, HB + 1.4);
    par[i * 3] = rr(7.0, 13.5);
    par[i * 3 + 1] = rr(0.30, 0.85);
    par[i * 3 + 2] = rr(0.22, 0.90);
  }
  geo.setAttribute('aPos', new THREE.InstancedBufferAttribute(pos, 3));
  geo.setAttribute('aPar', new THREE.InstancedBufferAttribute(par, 3));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: SH.uTime, uTop: { value: RAIN_TOP }, uBot: { value: RAIN_BOT } },
    vertexShader: /* glsl */`
      attribute vec3 aPos; attribute vec3 aPar;
      uniform float uTime, uTop, uBot;
      varying vec2 vUv; varying float vA;
      void main(){
        float span = uTop - uBot;
        float y = uTop - mod(uTime*aPar.x + aPos.y, span);
        float fall = (uTop - y);
        vec3 w = vec3(aPos.x + fall*0.115, y, aPos.z + fall*0.045);
        vec3 tc = cameraPosition - w; tc.y = 0.0;
        vec3 rgt = normalize(cross(vec3(0.0,1.0,0.0), normalize(tc + vec3(1e-4))));
        vec3 p = w + rgt*position.x*0.026 + vec3(0.0,1.0,0.0)*position.y*aPar.y;
        vUv = uv; vA = aPar.z;
        gl_Position = projectionMatrix * viewMatrix * vec4(p,1.0);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv; varying float vA;
      void main(){
        float a = vA;
        a *= smoothstep(0.0,0.22,vUv.y) * (1.0-smoothstep(0.55,1.0,vUv.y));
        a *= 1.0 - smoothstep(0.24,0.50, abs(vUv.x-0.5));
        gl_FragColor = vec4(vec3(0.60,0.76,1.0)*a*0.85, a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.layers.set(FX);
  scene.add(mesh);
})();

        e = max(e, smoothstep(0.30,0.72, 1.0-dot(nrm(vUv+o[i]), n0)) * step(d0, uFar*0.9) );
      }
      // 远处线条自动变淡，保持微缩模型的清爽感
      e *= mix(1.0, 0.35, smoothstep(30.0, 92.0, d0));

      vec3 col = texture2D(tColor, vUv).rgb;
      vec3 ink = col*0.11 + vec3(0.006,0.010,0.020);
      col = mix(col, ink, clamp(e,0.0,1.0)*0.88);

      col += texture2D(tBloom, vUv).rgb * uBloom;

      vec2 q = (vUv-0.5)*vec2(uRes.x/uRes.y,1.0);
      col *= mix(0.60, 1.0, smoothstep(1.28,0.32, length(q)*1.30));

      col = aces(col*uExp);
      col = pow(col, vec3(1.0/2.2));
      col += (h21(vUv*uRes + fract(uTime)*13.7)-0.5)*0.020;
      gl_FragColor = vec4(col,1.0);
    }`,
});
const quadBright = quadPass(brightMat), quadBlur = quadPass(blurMat), quadComp = quadPass(compMat);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  const bw = Math.max(2, Math.floor(w * pr)), bh = Math.max(2, Math.floor(h * pr));
  makeTargets(bw, bh);
  compMat.uniforms.uRes.value.set(bw, bh);
  blurMat.uniforms.uRes.value.set(bw >> 1, bh >> 1);
}
addEventListener('resize', resize);
resize();

/* ================================================================
   动画状态：招牌闪烁 / 自动门 / 信号灯 / 滴水
   ================================================================ */
const door = { state: 'closed', t: 0, wait: rr(3, 7), open: 0 };
const traffic = { t: 0, phase: 0 };  // 0 绿 1 黄 2 红
const PHASE_LEN = [7.5, 2.0, 8.5];

function flick(t, seed) {
  const s = Math.sin(t * 11.3 + seed) * 0.5 + Math.sin(t * 27.7 + seed * 2.1) * 0.3 + Math.sin(t * 3.1 + seed) * 0.2;
  let v = 1.0 + s * 0.035;
  // 偶发的一次性抖动（老灯管）
  const g = Math.sin(t * 0.37 + seed);
  if (g > 0.985) v *= 0.60 + 0.4 * Math.abs(Math.sin(t * 61.0));
  return v;
}

const clock = new THREE.Clock();
let tAcc = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  tAcc += dt;
  const t = tAcc;
  SH.uTime.value = t;
  SH.uCam.value.copy(camera.position);

  /* --- 招牌 / 灯箱轻微闪烁 --- */
  const fSign = flick(t, 1.7);
  const fBox = flick(t, 4.3) * 0.5 + 0.5 * flick(t, 8.1);
  G.signFront.color.setRGB(1.45 * fSign, 1.45 * fSign, 1.40 * fSign, THREE.LinearSRGBColorSpace);
  G.signSide.color.setRGB(1.35 * fSign, 1.35 * fSign, 1.30 * fSign, THREE.LinearSRGBColorSpace);
  G.lightbox.color.setRGB(1.90 * fBox, 1.75 * fBox, 1.35 * fBox, THREE.LinearSRGBColorSpace);
  const fCeil = 1.0 + 0.012 * Math.sin(t * 7.3);
  G.ceiling.color.setRGB(2.50 * fCeil, 2.35 * fCeil, 1.95 * fCeil, THREE.LinearSRGBColorSpace);
  signLight.intensity = 2.0 * fSign;
  inLight1.intensity = 5.2 * fCeil; inLight2.intensity = 4.4 * fCeil;
  const fVend = flick(t, 12.9);
  G.vendC.color.setRGB(1.55 * fVend, 1.55 * fVend, 1.55 * fVend, THREE.LinearSRGBColorSpace);

  /* --- 自动门开合 --- */
  door.t += dt;
  if (door.state === 'closed' && door.t > door.wait) { door.state = 'opening'; door.t = 0; }
  else if (door.state === 'opening') { door.open = Math.min(1, door.t / 0.85); if (door.open >= 1) { door.state = 'held'; door.t = 0; } }
  else if (door.state === 'held' && door.t > 2.1) { door.state = 'closing'; door.t = 0; }
  else if (door.state === 'closing') { door.open = Math.max(0, 1 - door.t / 1.0); if (door.open <= 0) { door.state = 'closed'; door.t = 0; door.wait = rr(4, 10); } }
  const eo = door.open < 0.5 ? 2 * door.open * door.open : 1 - Math.pow(-2 * door.open + 2, 2) / 2;
  doorL.position.x = doorBaseL - eo * 0.86;
  doorR.position.x = doorBaseR + eo * 0.86;

  /* --- 远处信号灯 --- */
  traffic.t += dt;
  if (traffic.t > PHASE_LEN[traffic.phase]) { traffic.t = 0; traffic.phase = (traffic.phase + 1) % 3; }
  const on = [traffic.phase === 2, traffic.phase === 1, traffic.phase === 0];
  const blink = traffic.phase === 0 && traffic.t > PHASE_LEN[0] - 2.2 ? (Math.sin(t * 12) > 0 ? 1 : 0.25) : 1;
  trafficLights.r.material.color.setRGB(on[0] ? 2.6 : 0.30, on[0] ? 0.24 : 0.05, on[0] ? 0.20 : 0.05, THREE.LinearSRGBColorSpace);
  trafficLights.y.material.color.setRGB(on[1] ? 2.6 : 0.30, on[1] ? 1.85 : 0.22, on[1] ? 0.25 : 0.05, THREE.LinearSRGBColorSpace);
  trafficLights.g.material.color.setRGB(on[2] ? 0.30 * blink : 0.05, on[2] ? 2.5 * blink : 0.28, on[2] ? 1.25 * blink : 0.14, THREE.LinearSRGBColorSpace);
  trafficLights.pedR.material.color.setRGB(on[0] ? 2.2 : 0.22, on[0] ? 0.22 : 0.04, on[0] ? 0.18 : 0.04, THREE.LinearSRGBColorSpace);
  trafficLights.pedG.material.color.setRGB(on[2] ? 0.22 : 0.04, on[2] ? 2.1 * blink : 0.20, on[2] ? 1.0 * blink : 0.10, THREE.LinearSRGBColorSpace);
  const tc = on[0] ? new THREE.Color(0xff4a3a) : on[1] ? new THREE.Color(0xffc040) : new THREE.Color(0x4affa0);
  const ti = on[1] ? 1.5 : on[2] ? 1.3 * blink : 1.15;

  /* --- 更新湿地面倒影光源表 --- */
  reflectors.forEach((r, i) => {
    let mul = 1;
    if (r.k === 'sign') mul = fSign;
    else if (r.k === 'win' || r.k === 'win2') mul = fCeil;
    else if (r.k === 'vend') mul = fVend;
    else if (r.k === 'lamp' || r.k === 'lamp2') mul = flick(t, 20.1 + i);
    SH.uLp.value[i].copy(r.p);
    SH.uLr.value[i] = r.r;
    if (r.k === 'traffic') SH.uLc.value[i].copy(tc).multiplyScalar(r.i * ti);
    else SH.uLc.value[i].copy(r.c).multiplyScalar(r.i * mul);
  });

  /* --- 光晕呼吸 --- */
  halos.forEach(h => {
    let mul = 1;
    if (h.key === 'sign') mul = fSign;
    else if (h.key === 'win') mul = fCeil;
    else if (h.key === 'traffic') { h.s.material.color.copy(tc).multiplyScalar(h.inten * ti); return; }
    else mul = 1 + 0.05 * Math.sin(t * 2.1 + h.inten * 9.0);
    h.s.material.color.copy(h.base).multiplyScalar(h.inten * mul);
  });

  /* --- 屋檐滴水 --- */
  drips.forEach(dp => {
    dp.t += dt;
    const cyc = dp.fall + dp.wait;
    if (dp.t > cyc) { dp.t -= cyc; dp.splash = 0; }
    if (dp.t < dp.fall) {
      const k = dp.t / dp.fall;
      dp.d.visible = true;
      dp.d.position.set(dp.x, dp.y - (dp.y - dp.gy) * k * k, dp.z);
      dp.d.scale.set(0.5, 1.2 + k * 1.6, 0.5);
    } else dp.d.visible = false;
    if (dp.splash >= 0) {
      dp.splash += dt;
      const k = dp.splash / 0.62;
      if (k >= 1) { dp.splash = -1; dp.r.material.opacity = 0; dp.r.visible = false; }
      else {
        dp.r.visible = true;
        dp.r.scale.setScalar(0.06 + k * 0.42);
        dp.r.material.opacity = (1 - k) * 0.75;
      }
    }
  });

  /* --- 空闲后恢复缓慢自转 --- */
  if (idleTimer > 0) { idleTimer += dt; if (idleTimer > 5.0) { controls.autoRotate = true; idleTimer = 0; } }
  controls.update();

  /* ---------------- 渲染管线 ---------------- */
  // 1) 法线 + 深度（仅层 0：实体，用于生成描边）
  camera.layers.set(0);
  scene.overrideMaterial = normalMat;
  renderer.setClearColor(0x8080ff, 1);
  renderer.setRenderTarget(rtNormal);
  renderer.render(scene, camera);
  scene.overrideMaterial = null;

  // 2) 彩色（全部层）
  camera.layers.enableAll();
  renderer.setClearColor(0x05080e, 1);
  renderer.setRenderTarget(rtColor);
  renderer.render(scene, camera);

  // 3) 亮部提取 + 两次模糊 → 霓虹泛光
  brightMat.uniforms.tD.value = rtColor.texture;
  quadScene.clear(); quadScene.add(quadBright);
  renderer.setRenderTarget(rtBright); renderer.render(quadScene, quadCam);

  quadScene.clear(); quadScene.add(quadBlur);
  blurMat.uniforms.tD.value = rtBright.texture; blurMat.uniforms.uDir.value.set(1, 0);
  renderer.setRenderTarget(rtBlurA); renderer.render(quadScene, quadCam);
  blurMat.uniforms.tD.value = rtBlurA.texture; blurMat.uniforms.uDir.value.set(0, 1);
  renderer.setRenderTarget(rtBlurB); renderer.render(quadScene, quadCam);

  // 4) 合成：描边 + 泛光 + 暗角 + 色调
  compMat.uniforms.tColor.value = rtColor.texture;
  compMat.uniforms.tNormal.value = rtNormal.texture;
  compMat.uniforms.tDepth.value = rtNormal.depthTexture;
  compMat.uniforms.tBloom.value = rtBlurB.texture;
  compMat.uniforms.uNear.value = camera.near;
  compMat.uniforms.uFar.value = camera.far;
  quadScene.clear(); quadScene.add(quadComp);
  renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
