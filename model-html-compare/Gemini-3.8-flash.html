<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雨夜便利店街角 · 3D微缩日式二次元场景</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    /* 彻底无UI界面元素，仅加载过程短暂淡出提示 */
    #loader {
      position: fixed;
      inset: 0;
      background: #050811;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #79a8d4;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(121, 168, 212, 0.2);
      border-top-color: #64b5f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <!-- Three.js and modules via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div>24H KONBINI · 雨夜微缩模型加载中...</div>
  </div>
  <canvas id="webgl-canvas"></canvas>

  <script>
    // --- 1. 全局配置与基础渲染系统 ---
    const canvas = document.getElementById('webgl-canvas');
    const loader = document.getElementById('loader');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060a14);
    scene.fog = new THREE.FogExp2(0x0a1020, 0.015);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 150);
    // 经典日式二次元手办微缩景观观察角度：俯视侧前 45 度
    camera.position.set(16, 12, 17);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: "high-performance",
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92; // 适度调低曝光（从1.15降为0.92），杜绝泛白过曝，使夜色更深沉通透

    // 轨道控制器：自由平滑旋转、平移、缩放，严格限制不能看穿底座下方
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0.5, 2.4, 0.5);
    controls.minDistance = 6;
    controls.maxDistance = 35;
    controls.maxPolarAngle = Math.PI / 2 - 0.03; // 防止翻转到底座底面
    controls.autoRotate = false;

    // --- 后期处理：精致克制的动漫雨夜霓虹漫反射（降低泛光、提高阈值，杜绝白茫茫一片） ---
    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.42, // 从0.82压低至0.42，保持锐利与二次元清晰轮廓
      0.35, // 扩散半径适度收敛
      0.82  // 提升发光门槛至0.82，仅对灯芯与霓虹灯条发光，避免整个建筑大面积泛白
    );
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 2. 三渲二 (Cel-Shading / NPR) 梯度材质与辅助函数 ---
    // 生成二分阶梯卡通着色梯度贴图 (3段清晰二次元阴影截断面)
    function createToonGradient() {
      const canvas = document.createElement('canvas');
      canvas.width = 4;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      const colors = ['#5a687d', '#8ba2be', '#d4e2f2', '#ffffff'];
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = colors[i];
        ctx.fillRect(i, 0, 1, 1);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.NearestFilter;
      texture.magFilter = THREE.NearestFilter;
      return texture;
    }
    const toonGradient = createToonGradient();

    // 快捷创建二次元卡通着色材质
    function makeToonMaterial(params) {
      return new THREE.MeshToonMaterial({
        gradientMap: toonGradient,
        ...params
      });
    }

    // 漫画轮廓勾线材质 (Inverted Hull Anime Outline)
    const outlineMat = new THREE.MeshBasicMaterial({
      color: 0x080f1d,
      side: THREE.BackSide
    });

    function addOutline(mesh, thickness = 0.025) {
      if (!mesh.geometry) return;
      const outlineGeom = mesh.geometry.clone();
      const outlineMesh = new THREE.Mesh(outlineGeom, outlineMat);
      outlineMesh.scale.multiplyScalar(1 + thickness);
      mesh.add(outlineMesh);
      return outlineMesh;
    }

    // --- 3. 动态程序化纹理画板 (无需外部任何图片网络依赖，确保离线与即时完美加载) ---

    // 3.1 便利店门楣招牌贴图 (经典白底绿红蓝条纹日式便利店招牌 24h KONBINI)
    function createKonbiniSignTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 256;
      const ctx = c.getContext('2d');

      // 背景微光白
      ctx.fillStyle = '#f0f5fa';
      ctx.fillRect(0, 0, c.width, c.height);

      // 顶部三色二次元条纹 (绿、橙、深蓝)
      ctx.fillStyle = '#00a352';
      ctx.fillRect(0, 0, c.width, 24);
      ctx.fillStyle = '#ff6b00';
      ctx.fillRect(0, 24, c.width, 18);
      ctx.fillStyle = '#005bac';
      ctx.fillRect(0, c.height - 24, c.width, 24);

      // LOGO & 标语
      ctx.fillStyle = '#005bac';
      ctx.font = 'bold 92px "Hiragino Sans", "Meiryo", "Arial Black", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('HOTTO STATION', c.width / 2, 105);

      ctx.fillStyle = '#ff6b00';
      ctx.font = 'bold 38px sans-serif';
      ctx.fillText('24H CONVENIENCE STORE · ほっとステーション', c.width / 2, 175);

      // 发光图标
      ctx.fillStyle = '#00a352';
      ctx.beginPath();
      ctx.arc(85, 120, 48, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 44px sans-serif';
      ctx.fillText('24', 85, 120);

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 8;
      return tex;
    }

    // 3.2 湿润沥青路面、斑马线、路面标线、排水口
    function createStreetTexture() {
      const c = document.createElement('canvas');
      c.width = 2048;
      c.height = 2048;
      const ctx = c.getContext('2d');

      // 湿润柏油路面深青灰
      ctx.fillStyle = '#111824';
      ctx.fillRect(0, 0, c.width, c.height);

      // 路面雨水反光深浅颗粒
      for (let i = 0; i < 40000; i++) {
        const x = Math.random() * c.width;
        const y = Math.random() * c.height;
        const s = Math.random() * 2 + 1;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(30, 45, 68, 0.4)' : 'rgba(8, 12, 20, 0.6)';
        ctx.fillRect(x, y, s, s);
      }

      // 便利店门口停车位白线 (实线)
      ctx.strokeStyle = 'rgba(230, 240, 255, 0.82)';
      ctx.lineWidth = 14;
      ctx.strokeRect(300, 1150, 420, 700);
      ctx.strokeRect(740, 1150, 420, 700);

      // 街道中央分道虚线
      ctx.setLineDash([60, 45]);
      ctx.beginPath();
      ctx.moveTo(0, 1550);
      ctx.lineTo(2048, 1550);
      ctx.stroke();
      ctx.setLineDash([]);

      // 经典日本街角斑马线 (厚实微白微反光条纹)
      ctx.fillStyle = 'rgba(235, 242, 255, 0.88)';
      const zx = 1350;
      for (let i = 0; i < 9; i++) {
        ctx.fillRect(zx + i * 75, 1180, 42, 600);
      }

      // 日本地面减速/停车标线「止まれ」(TOMARE)
      ctx.save();
      ctx.translate(560, 1680);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = 'rgba(235, 242, 255, 0.78)';
      ctx.font = 'bold 96px "Hiragino Kaku Gothic Pro", "Yu Gothic", sans-serif';
      ctx.letterSpacing = '18px';
      ctx.fillText('止 ま れ', 0, 0);
      ctx.restore();

      // 街角黄色盲道警示条 (Tactile Paving)
      ctx.fillStyle = '#bfa126';
      ctx.fillRect(1280, 1020, 30, 800);
      ctx.fillStyle = '#d4b42b';
      for (let y = 1030; y < 1820; y += 35) {
        ctx.fillRect(1285, y, 20, 18);
      }

      // 道路侧排水铁格栅 (Grate)
      ctx.fillStyle = '#090d14';
      ctx.fillRect(120, 1030, 90, 45);
      ctx.fillRect(600, 1030, 90, 45);
      ctx.fillRect(1100, 1030, 90, 45);
      ctx.strokeStyle = '#354354';
      ctx.lineWidth = 3;
      for (let g = 0; g < 3; g++) {
        const gx = [120, 600, 1100][g];
        for (let l = 125; l < gx + 85; l += 8) {
          ctx.beginPath();
          ctx.moveTo(l, 1032);
          ctx.lineTo(l, 1073);
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 8;
      return tex;
    }

    // 3.3 自动贩卖机正面面板贴图 (经典红蓝日式冷热饮展示机)
    function createVendingMachineTexture(isRed = true) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 1024;
      const ctx = c.getContext('2d');

      // 机身基色
      ctx.fillStyle = isRed ? '#a31d1d' : '#1450a3';
      ctx.fillRect(0, 0, c.width, c.height);

      // 顶部广告灯箱 (Cold / Hot Drinks)
      ctx.fillStyle = '#e8f4ff';
      ctx.fillRect(30, 35, c.width - 60, 90);
      ctx.fillStyle = isRed ? '#a31d1d' : '#1450a3';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isRed ? 'DRINK & REFRESH' : 'ICE COLD & TEA', c.width / 2, 90);

      // 上中两层饮料橱窗
      ctx.fillStyle = '#060a12';
      ctx.fillRect(30, 145, c.width - 60, 390);

      // 绘制饮料罐列 (彩色罐子、蓝红 cold/warm 按钮)
      const drinkColors = ['#e63946', '#f4a261', '#2a9d8f', '#e9c46a', '#457b9d', '#1d3557', '#9b5de5', '#00bbf9'];
      for (let row = 0; row < 2; row++) {
        const ry = 165 + row * 185;
        // 背景灯光格
        ctx.fillStyle = '#1c2838';
        ctx.fillRect(40, ry, c.width - 80, 155);

        for (let col = 0; col < 6; col++) {
          const cx = 55 + col * 70;
          // 瓶罐
          ctx.fillStyle = drinkColors[(row * 6 + col) % drinkColors.length];
          ctx.beginPath();
          ctx.roundRect(cx, ry + 15, 45, 85, [5, 5, 2, 2]);
          ctx.fill();
          // 瓶身光泽
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.fillRect(cx + 8, ry + 18, 8, 78);

          // 价格按键标签
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('¥140', cx + 22, ry + 115);
          // 冷饮蓝标 / 热饮红标
          ctx.fillStyle = row === 0 ? '#1e88e5' : '#e53935';
          ctx.fillRect(cx + 4, ry + 125, 38, 12);
        }
      }

      // 中部：投币口、LED金额屏幕、取零钱口
      ctx.fillStyle = '#0a0e17';
      ctx.fillRect(30, 560, c.width - 60, 170);

      // 投币高亮区
      ctx.fillStyle = '#243447';
      ctx.fillRect(330, 580, 120, 130);
      ctx.fillStyle = '#00e676';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('¥ 0', 390, 615);
      ctx.fillStyle = '#111';
      ctx.fillRect(380, 635, 20, 4); // 投币孔

      // 常见海报
      ctx.fillStyle = '#f77f00';
      ctx.fillRect(60, 580, 240, 130);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('NEW BOSS', 180, 630);
      ctx.font = '16px sans-serif';
      ctx.fillText('COFFEE ROAST', 180, 660);

      // 底部大取物口 (Push 盖门)
      ctx.fillStyle = '#080d14';
      ctx.fillRect(45, 760, c.width - 90, 190);
      ctx.strokeStyle = '#3e4f63';
      ctx.lineWidth = 6;
      ctx.strokeRect(55, 770, c.width - 110, 170);
      ctx.fillStyle = '#8395a7';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('P U S H', c.width / 2, 855);

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4;
      return tex;
    }

    // 3.4 室内整面冷柜饮料墙贴图 (透亮、整齐、日式便利店灵魂饮料冷柜)
    function createBeverageCoolerTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      // 冷柜内部冷白色高亮背景
      ctx.fillStyle = '#dceeff';
      ctx.fillRect(0, 0, c.width, c.height);

      // 顶部条形灯
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, 30);

      // 4层货架
      const rowCount = 4;
      const rowHeight = 115;
      const cans = ['#e63946', '#2a9d8f', '#e76f51', '#264653', '#f4a261', '#457b9d', '#588157', '#d62828', '#0077b6', '#a37081'];

      for (let r = 0; r < rowCount; r++) {
        const y = 35 + r * rowHeight;
        // 层板
        ctx.fillStyle = '#9cb6ce';
        ctx.fillRect(0, y + 95, c.width, 14);

        // 排列密密麻麻的日式饮料/牛奶/茶饮
        for (let x = 10; x < c.width - 25; x += 32) {
          const color = cans[(r * 15 + Math.floor(x / 32)) % cans.length];
          // 饮料盒/瓶体
          ctx.fillStyle = color;
          ctx.fillRect(x, y + 10, 24, 82);
          // 白色反光与标签
          ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.fillRect(x + 4, y + 15, 6, 72);
          ctx.fillRect(x + 3, y + 45, 18, 16);
        }
      }

      // 玻璃门金属边框分隔
      ctx.strokeStyle = '#5a738e';
      ctx.lineWidth = 8;
      for (let dx = 0; dx <= c.width; dx += 256) {
        ctx.beginPath();
        ctx.moveTo(dx, 0);
        ctx.lineTo(dx, c.height);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    // 3.5 货架商品陈列贴图 (薯片、零食袋、泡面杯、饭团)
    function createSnackShelfTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#2b3846';
      ctx.fillRect(0, 0, c.width, c.height);

      // 3层金属货架板
      for (let i = 0; i < 3; i++) {
        const sy = 20 + i * 80;
        ctx.fillStyle = '#4a5b6d';
        ctx.fillRect(0, sy + 65, c.width, 10);
        // 红色黄色价格标签条
        ctx.fillStyle = '#e63946';
        ctx.fillRect(0, sy + 70, c.width, 5);

        // 琳琅满目的零食包装
        const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590'];
        for (let j = 10; j < c.width - 20; j += 28) {
          ctx.fillStyle = colors[(i * 11 + j) % colors.length];
          ctx.fillRect(j, sy + 15, 22, 50);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.fillRect(j + 3, sy + 25, 16, 12);
        }
      }

      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    // 3.6 室内地砖贴图 (柔和微米白瓷砖 + 进门防滑地垫)
    function createInteriorFloorTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#e8ecf1';
      ctx.fillRect(0, 0, c.width, c.height);

      // 瓷砖缝隙
      ctx.strokeStyle = '#c5d0dc';
      ctx.lineWidth = 4;
      const tileSize = 64;
      for (let x = 0; x <= c.width; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, c.height);
        ctx.stroke();
      }
      for (let y = 0; y <= c.height; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(c.width, y);
        ctx.stroke();
      }

      // 排队指引脚印 (Social distancing footprints)
      ctx.fillStyle = '#457b9d';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('WAIT HERE  ↓↓', c.width / 2, 260);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      return tex;
    }

    // 3.7 雨水滑落与流痕纹理 (给玻璃窗做动态雨痕滑落)
    function createRainWindowTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = 'rgba(215, 235, 255, 0.28)';

      for (let i = 0; i < 90; i++) {
        const x = Math.random() * c.width;
        const y = Math.random() * c.height;
        const len = Math.random() * 45 + 15;
        const w = Math.random() * 2.5 + 1;
        ctx.beginPath();
        ctx.roundRect(x, y, w, len, 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }
    const rainWindowTex = createRainWindowTexture();

    // 3.8 宣传海报栏贴图 (动漫电影海报、夏季关东煮特赏、新品便当)
    function createPosterTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#1c2636';
      ctx.fillRect(0, 0, c.width, c.height);

      // 海报1：热气腾腾关东煮 ODEN
      ctx.fillStyle = '#d97706';
      ctx.fillRect(15, 15, 145, 226);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('おでん', 87, 60);
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('熱々好評中!', 87, 95);
      // 串签简笔画
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(80, 115, 15, 80);

      // 海报2：动漫新番联动海报
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(180, 15, 145, 226);
      ctx.fillStyle = '#93c5fd';
      ctx.beginPath();
      ctx.arc(252, 90, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('ANIME EXPO', 252, 160);
      ctx.font = '12px sans-serif';
      ctx.fillText('限定グッズ販売中', 252, 190);

      // 海报3：现磨咖啡 HOT COFFEE
      ctx.fillStyle = '#451a03';
      ctx.fillRect(345, 15, 150, 226);
      ctx.fillStyle = '#d97706';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('MACHI cafe', 420, 65);

    function createCatenaryWire(p1, p2, sag = 0.5, segments = 24) {
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = THREE.MathUtils.lerp(p1.x, p2.x, t);
        const z = THREE.MathUtils.lerp(p1.z, p2.z, t);
        // 抛物线重力自然下垂
        const sagY = 4 * sag * (t - 0.5) * (t - 0.5) - sag;
        const y = THREE.MathUtils.lerp(p1.y, p2.y, t) + sagY;
        points.push(new THREE.Vector3(x, y, z));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const wireGeom = new THREE.TubeGeometry(curve, 24, 0.022, 6, false);
      const wireMat = new THREE.MeshBasicMaterial({ color: 0x090e17 });
      return new THREE.Mesh(wireGeom, wireMat);
    }

    alleyGroup.add(fanGrille);

    const fanBladeGeom = new THREE.BoxGeometry(0.5, 0.05, 0.02);
    const fanBladeMat = new THREE.MeshBasicMaterial({ color: 0x334155 });
    const fanBlade = new THREE.Mesh(fanBladeGeom, fanBladeMat);
    fanBlade.position.set(0.95, 1.2, 0.28);
    alleyGroup.add(fanBlade);

    // 小巷口日式黄色工程安全锥 (Traffic Pylon / Cones)
    const coneGeom = new THREE.CylinderGeometry(0.04, 0.22, 0.7, 12);
    const coneMat = makeToonMaterial({ color: 0xf97316 });
    const cone1 = new THREE.Mesh(coneGeom, coneMat);
    cone1.position.set(-0.4, 0.35, 1.8);
    alleyGroup.add(cone1);
    addOutline(cone1, 0.03);

    // 白色反光环
    const coneStripe = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.14, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    coneStripe.position.set(-0.4, 0.38, 1.8);
    alleyGroup.add(coneStripe);

    // 4.7.9 社区公告栏与电影促销海报架 (Bulletin Board & Poster Stand)
    const posterBoardGroup = new THREE.Group();
    posterBoardGroup.position.set(5.8, 0.28, 4.4);
    posterBoardGroup.rotation.y = -0.3;
    worldGroup.add(posterBoardGroup);

    const posterTex = createPosterTexture();
    const boardFrame = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 1.2, 0.08),
      makeToonMaterial({ color: 0x334155 })
    );
    boardFrame.position.y = 1.35;
    boardFrame.castShadow = true;
    posterBoardGroup.add(boardFrame);
    addOutline(boardFrame, 0.02);

    // 海报展示面
    const boardFace = new THREE.Mesh(
      new THREE.PlaneGeometry(1.7, 1.1),
      new THREE.MeshBasicMaterial({ map: posterTex })
    );
    boardFace.position.set(0, 1.35, 0.05);
    posterBoardGroup.add(boardFace);

    // 双支撑立柱
    const boardLeg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.4, 8), poleMat);
    boardLeg1.position.set(-0.75, 0.7, 0);
    posterBoardGroup.add(boardLeg1);
    const boardLeg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.4, 8), poleMat);
    boardLeg2.position.set(0.75, 0.7, 0);
    posterBoardGroup.add(boardLeg2);

    // 公告栏顶部小夜灯
    const boardLamp = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.15), makeToonMaterial({ color: 0x1e293b }));
    boardLamp.position.set(0, 1.98, 0.15);
    posterBoardGroup.add(boardLamp);
    const boardLight = new THREE.PointLight(0xfff1d2, 0.9, 2.5);
    boardLight.position.set(0, 1.9, 0.3);
    posterBoardGroup.add(boardLight);

    // 4.7.10 行人过街信号灯与按钮箱 (Pedestrian Push-Button Signal)
    const signalPole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.4, 8), poleMat);
    signalPole.position.set(1.4, 1.7 + 0.28, 6.2);
    worldGroup.add(signalPole);

    // 行人灯箱
    const signalBox = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.65, 0.25), makeToonMaterial({ color: 0x1e293b }));
    signalBox.position.set(1.4, 3.1 + 0.28, 6.2);
    worldGroup.add(signalBox);

    // 信号灯红绿双透镜
    const redLightMesh = new THREE.Mesh(new THREE.CircleGeometry(0.09, 12), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
    redLightMesh.position.set(1.4, 3.25 + 0.28, 6.33);
    worldGroup.add(redLightMesh);

    const greenLightMesh = new THREE.Mesh(new THREE.CircleGeometry(0.09, 12), new THREE.MeshBasicMaterial({ color: 0x052e16 })); // 初始微弱
    greenLightMesh.position.set(1.4, 2.95 + 0.28, 6.33);
    worldGroup.add(greenLightMesh);

    // 押ボタン式 黄色触控箱
    const pushBox = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.3, 0.14), makeToonMaterial({ color: 0xfacc15 }));
    pushBox.position.set(1.4, 1.35 + 0.28, 6.2);
    worldGroup.add(pushBox);

    // ==========================================
    // 5. 动态降雨、屋檐滴水与天气动效系统 (Rain & Weather Animation)
    // ==========================================

    // 5.1 二次元风格细密雨丝系统 (Fine Anime Rainy Night System - 调整为舒适温和的细雨，精准覆盖底座区域)
    const RAIN_COUNT = 650; // 从1800降至650，雨量由暴雨调整为日式动画意境的温和细雨
    const rainPositions = new Float32Array(RAIN_COUNT * 6); // 线段两端 (x1, y1, z1, x2, y2, z2)
    const rainVelocities = new Float32Array(RAIN_COUNT);

    // 精确匹配正方形底座边界 (BASE_SIZE = 22, 半径 11)，彻底消除偏置错位
    const RAIN_BOUND_XZ = BASE_SIZE;
    const RAIN_HEIGHT_MIN = 0.05; // 刚触碰底座路面即回收，绝不穿透底座下边缘
    const RAIN_HEIGHT_MAX = 13.5;
    const RAIN_LENGTH = 0.38; // 缩短雨丝长度，从0.65降为0.38，更加精致细软
    const RAIN_SLANT_X = -0.06; // 雨丝微倾斜角度收敛，更显轻柔垂直

    for (let i = 0; i < RAIN_COUNT; i++) {
      const idx = i * 6;
      const x = (Math.random() - 0.5) * RAIN_BOUND_XZ;
      const y = Math.random() * (RAIN_HEIGHT_MAX - RAIN_HEIGHT_MIN) + RAIN_HEIGHT_MIN;
      const z = (Math.random() - 0.5) * RAIN_BOUND_XZ;

      rainPositions[idx] = x;
      rainPositions[idx + 1] = y;
      rainPositions[idx + 2] = z;

      rainPositions[idx + 3] = x + RAIN_SLANT_X * RAIN_LENGTH;
      rainPositions[idx + 4] = y - RAIN_LENGTH;
      rainPositions[idx + 5] = z;

      rainVelocities[i] = 0.16 + Math.random() * 0.12; // 降速更为平缓柔和，避免暴雨急促感
    }

    const rainGeom = new THREE.BufferGeometry();
    rainGeom.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));

    const rainMat = new THREE.LineBasicMaterial({
      color: 0x9dc6f8,
      transparent: true,
      opacity: 0.38, // 柔和半透明，不喧宾夺主，凸显模型微缩精致感
      blending: THREE.AdditiveBlending
    });

    const rainLines = new THREE.LineSegments(rainGeom, rainMat);
    worldGroup.add(rainLines); // 挂载到 worldGroup，与整个微缩底座完全同轴无错位！

    // 5.2 屋檐雨滴下落与水花 (Eaves Water Droplets)
    const DROP_COUNT = 32;
    const drops = [];
    const dropGeom = new THREE.SphereGeometry(0.035, 6, 6);
    const dropMat = new THREE.MeshBasicMaterial({ color: 0xbad7f2, transparent: true, opacity: 0.8 });

    // 沿便利店前屋檐边缘排布滴水点
    const eavesLeft = STORE_POS_X - STORE_WIDTH / 2;
    const eavesRight = STORE_POS_X + STORE_WIDTH / 2;
    const eavesZ = STORE_POS_Z + STORE_DEPTH / 2 + 1.4;
    const eavesY = STORE_HEIGHT + 0.15;

    for (let d = 0; d < DROP_COUNT; d++) {
      const drop = new THREE.Mesh(dropGeom, dropMat);
      const x = THREE.MathUtils.lerp(eavesLeft, eavesRight, Math.random());
      drop.position.set(x, eavesY, eavesZ);
      drop.userData = {
        speed: 0.08 + Math.random() * 0.06,
        resetY: eavesY,
        floorY: 0.3,
        originX: x,
        originZ: eavesZ
      };
      worldGroup.add(drop);
      drops.push(drop);
    }

    // ==========================================
    // 6. 环境整体灯光氛围布局 (Color & Mood Lighting)
    // ==========================================
    // 寒冷潮湿但通透的深靛青蓝夜空环境光
    const ambientLight = new THREE.AmbientLight(0x1a2e48, 1.35);
    scene.add(ambientLight);

    // 漫射天光 (月夜薄云透出的微弱冷辉)
    const moonDirLight = new THREE.DirectionalLight(0x567da6, 0.9);
    moonDirLight.position.set(12, 18, 14);
    moonDirLight.castShadow = true;
    moonDirLight.shadow.mapSize.width = 2048;
    moonDirLight.shadow.mapSize.height = 2048;
    moonDirLight.shadow.camera.near = 1;
    moonDirLight.shadow.camera.far = 45;
    moonDirLight.shadow.camera.left = -14;
    moonDirLight.shadow.camera.right = 14;
    moonDirLight.shadow.camera.top = 14;
    moonDirLight.shadow.camera.bottom = -14;
    moonDirLight.shadow.bias = -0.0005;
    scene.add(moonDirLight);

    // 街角二次元反差辅助冷色勾边背光 (Rim Light)
    const rimLight = new THREE.DirectionalLight(0x385c8a, 0.85);
    rimLight.position.set(-15, 12, -15);
    scene.add(rimLight);

    // 便利店大门外路面金黄暖色漫反射光晕 (Ground Warm Light Spill - 柔和微光)
    const streetWarmGlow = new THREE.PointLight(0xffb84d, 0.95, 6.5, 1.3);
    streetWarmGlow.position.set(STORE_POS_X + 1.2, 0.4, STORE_POS_Z + STORE_DEPTH / 2 + 2.0);
    worldGroup.add(streetWarmGlow);

    // ==========================================
    // 7. 动画主循环与状态控制器 (Render Loop & State Manager)
    // ==========================================
    const clock = new THREE.Clock();

    // 自动滑动玻璃门状态机变量
    let doorTimer = 0;
    let doorState = 0; // 0: 关闭等待, 1: 正在开门, 2: 保持开启, 3: 正在关门
    let doorOpenOffset = 0; // 0 -> 0.72

    // 信号灯变换计时器
    let signalTimer = 0;

    // 波纹产生计时器
    let rippleTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 7.1 降雨雨丝下落更新
      const posArr = rainGeom.attributes.position.array;
      for (let i = 0; i < RAIN_COUNT; i++) {
        const idx = i * 6;
        const v = rainVelocities[i];

        posArr[idx + 1] -= v;
        posArr[idx + 4] -= v;
        posArr[idx] += RAIN_SLANT_X * v;
        posArr[idx + 3] += RAIN_SLANT_X * v;

        // 触底重置到正上方，并约束 XZ 边界防止随斜向位移漂移到底座外
        if (posArr[idx + 4] < RAIN_HEIGHT_MIN) {
          const rx = (Math.random() - 0.5) * RAIN_BOUND_XZ;
          const rz = (Math.random() - 0.5) * RAIN_BOUND_XZ;
          const ry = RAIN_HEIGHT_MAX + Math.random() * 1.5;

          posArr[idx] = rx;
          posArr[idx + 1] = ry;
          posArr[idx + 2] = rz;

          posArr[idx + 3] = rx + RAIN_SLANT_X * RAIN_LENGTH;
          posArr[idx + 4] = ry - RAIN_LENGTH;
          posArr[idx + 5] = rz;
        }

        // 若向左飘移超出底座左边缘，从右侧循环包裹进入，确保无论下多久都严丝合缝在底座正上方
        if (posArr[idx] < -RAIN_BOUND_XZ / 2) {
          posArr[idx] += RAIN_BOUND_XZ;
          posArr[idx + 3] += RAIN_BOUND_XZ;
        }
      }
      rainGeom.attributes.position.needsUpdate = true;

      // 7.2 屋檐雨滴掉落与地面微小水花触发
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        d.position.y -= d.userData.speed;
        if (d.position.y <= d.userData.floorY) {
          // 产生微小水花波纹
          if (Math.random() > 0.6) {
            spawnRipple(d.position.x, d.position.z);
          }
          d.position.y = d.userData.resetY;
        }
      }

      // 7.3 地面积水波纹扩散热更
      rippleTimer += delta;
      if (rippleTimer > 0.45) {
        rippleTimer = 0;
        // 随机在积水处产生自然雨点波纹
        const puddleTargets = [
          { x: 4.2 + (Math.random() - 0.5) * 2.8, z: 4.5 + (Math.random() - 0.5) * 2.8 },
          { x: -2.5 + (Math.random() - 0.5) * 2.2, z: 5.2 + (Math.random() - 0.5) * 2.2 },
          { x: -6.2 + (Math.random() - 0.5) * 1.8, z: 3.8 + (Math.random() - 0.5) * 1.8 }
        ];
        const pt = puddleTargets[Math.floor(Math.random() * puddleTargets.length)];
        spawnRipple(pt.x, pt.z);
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.userData.scale += r.userData.speed;
        r.scale.set(r.userData.scale, r.userData.scale, 1);
        r.material.opacity = Math.max(0, 0.7 * (1 - r.userData.scale / r.userData.maxScale));

        if (r.userData.scale >= r.userData.maxScale) {
          worldGroup.remove(r);
          r.geometry.dispose();
          r.material.dispose();
          ripples.splice(i, 1);
        }
      }

      // 7.4 关东煮热腾腾蒸汽缓缓升腾
      for (let i = 0; i < steamParticles.length; i++) {
        const sp = steamParticles[i];
        sp.position.y += sp.userData.speedY;
        sp.material.opacity = Math.max(0, 0.35 * (1 - (sp.position.y - sp.userData.initY) / sp.userData.maxLife));
        if (sp.position.y > sp.userData.initY + sp.userData.maxLife) {
          sp.position.y = sp.userData.initY;
          sp.position.x = 0.05 + (Math.random() - 0.5) * 0.3;
          sp.position.z = -0.6 + (Math.random() - 0.5) * 0.4;
        }
      }

      // 7.5 空调外机扇叶持续平稳旋转
      fanBlade.rotation.z += 0.12;

      // 7.6 自动感应滑动门开合动效 (Smooth Sliding Doors Sequence)
      doorTimer += delta;
      if (doorState === 0) {
        // 关闭等待状态 (等待 6 秒后开门)
        if (doorTimer > 6.0) {
          doorState = 1; // 触发开门
          doorTimer = 0;
        }
      } else if (doorState === 1) {
        // 正在平滑开门
        doorOpenOffset += delta * 1.1;
        if (doorOpenOffset >= 0.7) {
          doorOpenOffset = 0.7;
          doorState = 2; // 保持全开
          doorTimer = 0;
        }
      } else if (doorState === 2) {
        // 保持开启等待 (留出 3.5 秒让顾客通过)
        if (doorTimer > 3.5) {
          doorState = 3; // 触发关门
          doorTimer = 0;
        }
      } else if (doorState === 3) {
        // 正在平滑关门
        doorOpenOffset -= delta * 0.9;
        if (doorOpenOffset <= 0) {
          doorOpenOffset = 0;
          doorState = 0; // 回到关闭
          doorTimer = 0;
        }
      }
      leftDoor.position.x = -0.41 - doorOpenOffset;
      rightDoor.position.x = 0.41 + doorOpenOffset;

      // 7.7 玻璃窗上雨丝水痕贴图微位移下流动效
      rainWindowTex.offset.y -= delta * 0.06;

      // 7.8 便利店发光招牌与室内荧光灯微妙写实拟真微频闪 (Realistic Fluorescent Micro-Flicker)
      // 模拟日式老店或雨夜轻微电压波动的温馨生动感
      const flickerNoise = Math.sin(time * 18.0) * Math.cos(time * 33.0);
      signGlowLight.intensity = 1.35 + flickerNoise * 0.08;
      interiorWarmLight1.intensity = 2.6 + flickerNoise * 0.05;

      // 7.9 街角交通信号灯微弱交替
      signalTimer += delta;
      if (signalTimer % 8.0 < 5.0) {
        // 红灯常亮
        redLightMesh.material.color.setHex(0xef4444);
        greenLightMesh.material.color.setHex(0x064e3b);
      } else {
        // 绿灯通行闪烁
        redLightMesh.material.color.setHex(0x450a0a);
        const greenPulse = Math.sin(time * 8.0) > 0 ? 0x22c55e : 0x064e3b;
        greenLightMesh.material.color.setHex(greenPulse);
      }

      // 7.10 轨道控制器惯性更新与后期辉光合成渲染
      controls.update();
      composer.render();
    }

    // 窗口尺寸自适应调整
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // 双击重置手办视角
    window.addEventListener('dblclick', () => {
      camera.position.set(16, 12, 17);
      controls.target.set(0.5, 2.4, 0.5);
    });

    // 启动主循环与优雅淡出加载指示器
    requestAnimationFrame(animate);

    window.addEventListener('load', () => {
      setTimeout(() => {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
      }, 500);
    });
  </script>
</body>
</html>
