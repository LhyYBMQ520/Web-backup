/* roundRect 兼容 */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number'){var rr=[r,r,r,r];} else {var rr=r;}
    this.beginPath();
    this.moveTo(x+rr[0],y);
    this.arcTo(x+w,y,x+w,y+h,rr[1]); this.arcTo(x+w,y+h,x,y+h,rr[2]);
    this.arcTo(x,y+h,x,y,rr[3]); this.arcTo(x,y,x+w,y,rr[0]); this.closePath(); return this;
  };
}

function glow(x,y,z,sx,sy,color,opacity){

}
/* 发光体柔光（平面贴片 / 面向镜头的光晕） */
function halo(x,y,z,sx,sy,color,opacity,parent,rot){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:texGlow,color:color,transparent:true,opacity:opacity,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  m.position.set(x,y,z); m.scale.set(sx,sy,1);
  if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
  m.userData.baseOp=opacity; (parent||scene).add(m); return m;
}
function haloSprite(x,y,z,s,color,opacity){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:texGlow,color:color,transparent:true,opacity:opacity,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  sp.position.set(x,y,z); sp.scale.set(s,s,1); sp.userData.baseOp=opacity; scene.add(sp); return sp;
}
function ripple(x,y,z,scale,rate,color){
  const m=new THREE.Mesh(new THREE.RingGeometry(0.08,0.11,28), new THREE.MeshBasicMaterial({color:color||0x9ec0ea,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  m.rotation.x=-Math.PI/2; m.position.set(x,y,z); scene.add(m);
  const phase=Math.random();
  anim.push((t)=>{const k=(t*rate+phase)%1; const s=0.3+k*scale; m.scale.set(s,s,s); m.material.opacity=(1-k)*0.42;});
  return m;
}

/* ============================================================

   ============================================================ */
const RAIN_N=MOBILE?2800:4200;
const rainGeo=new THREE.BufferGeometry();
const rainPos=new Float32Array(RAIN_N*6);
const drops=[];
function resetDrop(d,initial){
  let x=-30+Math.random()*60, z=-30+Math.random()*60;
  if(x>-11.5&&x<5.5&&z>-12.5&&z<-1.5){ x-=18; }
  d.x=x; d.z=z;
  d.y= initial ? Math.random()*34 : 30+Math.random()*6;
  d.s=9+Math.random()*7;
}
for(let i=0;i<RAIN_N;i++){
  const d={}; resetDrop(d,true); drops.push(d);
  const idx=i*6;
  rainPos[idx]=d.x; rainPos[idx+1]=d.y; rainPos[idx+2]=d.z;
  rainPos[idx+3]=d.x+0.09; rainPos[idx+4]=d.y+0.36; rainPos[idx+5]=d.z+0.02;
}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0xaec6e8,transparent:true,opacity:0.26}));
rain.frustumCulled=false; scene.add(rain);
const WIND=1.6;
function updateRain(dt){
  for(let i=0;i<RAIN_N;i++){
    const d=drops[i]; const idx=i*6;
    d.y-=d.s*dt; d.x-=WIND*dt;
    if(d.y<0.15||d.x<-31){ resetDrop(d,false); }
    rainPos[idx]=d.x; rainPos[idx+1]=d.y; rainPos[idx+2]=d.z;
    rainPos[idx+3]=d.x+0.09; rainPos[idx+4]=d.y+0.36; rainPos[idx+5]=d.z+0.02;
  }
  rainGeo.attributes.position.needsUpdate=true;
}

/* ============================================================
   渲染循环
   ============================================================ */
window.addEventListener('resize',()=>{
  const a=window.innerWidth/window.innerHeight;
  camera.fov = a<0.8?66:(a<1.2?45:38);
  camera.aspect=a;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

const clock=new THREE.Clock();
let dt=0;
if(REDUCE){
  renderer.render(scene,camera);
  controls.addEventListener('change',()=>renderer.render(scene,camera));
}else{
  (function loop(){
    requestAnimationFrame(loop);
    dt=Math.min(clock.getDelta(),0.05);
    const t=clock.elapsedTime;
    for(let i=0;i<anim.length;i++) anim[i](t,dt);
    controls.update();
    renderer.render(scene,camera);
  })();
}
window.__sceneReady=true;
})();
